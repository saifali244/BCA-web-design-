<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration Form</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f3f7fb; padding: 20px; }
    form { max-width: 600px; margin: auto; background: white; padding: 24px; border-radius: 8px; }
    label { display: block; margin-top: 14px; font-weight: bold; }
    input, select, textarea { box-sizing: border-box; width: 100%; padding: 9px; margin-top: 5px; }
    .inline { display: inline; font-weight: normal; margin-right: 12px; }
    .inline input { width: auto; }
    button { padding: 10px 18px; margin: 18px 8px 0 0; cursor: pointer; }
  </style>
</head>
<body>
  <form action="#" method="post" enctype="multipart/form-data">
    <h1>Student Registration</h1>
    <label for="fullname">Full Name</label>
    <input type="text" id="fullname" name="fullname" required>

    <label for="email">Email Address</label>
    <input type="email" id="email" name="email" required>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" minlength="8" required>

    <label>Gender</label>
    <label class="inline"><input type="radio" name="gender" value="male"> Male</label>
    <label class="inline"><input type="radio" name="gender" value="female"> Female</label>
    <label class="inline"><input type="radio" name="gender" value="other"> Other</label>

    <label for="course">Course</label>
    <select id="course" name="course" required>
      <option value="">Select a course</option><option>BCA</option><option>BBA</option><option>BA</option><option>B.Com</option>
    </select>

    <label for="dob">Date of Birth</label>
    <input type="date" id="dob" name="dob" required>

    <label>Hobbies</label>
    <label class="inline"><input type="checkbox" name="hobbies" value="music"> Music</label>
    <label class="inline"><input type="checkbox" name="hobbies" value="sports"> Sports</label>
    <label class="inline"><input type="checkbox" name="hobbies" value="reading"> Reading</label>

    <label for="address">Address</label>
    <textarea id="address" name="address" rows="3"></textarea>

    <label for="photo">Upload Photograph</label>
    <input type="file" id="photo" name="photo" accept="image/*">

    <button type="submit">Submit Registration</button>
    <button type="reset">Reset Form</button>
  </form>
</body>
</html>
<!-- Labels improve accessibility. Input types such as email, password, date, radio, checkbox and file
     provide suitable controls and basic browser validation. This sample form does not send data to a server. -->
